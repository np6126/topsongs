[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topsongs"
version = "0.2.6"
description = "Planner for Last.fm top tracks mapped to Jellyfin music libraries"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "np6126" }
]
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27,<0.29",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "rich>=13.7,<16.0",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "croniter>=2.0,<7.0",
]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.5,<0.6",
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "croniter>=2.0,<7.0",
  "httpx>=0.27,<0.29",
]

[project.scripts]
topsongs = "topsongs.cli:main"
run-topsongs = "topsongs.cli:main"
topsongs-missing = "topsongs.missing_cli:main"
topsongs-purge = "topsongs.purge_cli:main"
topsongs-prune = "topsongs.prune_cli:main"
topsongs-web = "topsongs.web.app:main"

[tool.setuptools]
packages = ["topsongs", "topsongs.providers", "topsongs.web"]

[tool.setuptools.package-data]
"topsongs.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
